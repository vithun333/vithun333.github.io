<style>
@font-face{font-family:'Humanism';src:url('fonts/humanism-bolddemo.otf') format('opentype');font-weight:700;font-display:swap}
:root{
  --paper:#EFECE4; --paper-2:#E6E2D8; --paper-3:#DCD7CB;
  --ink:#12120F; --ink-2:#1C1C18; --muted:#6F6C63;
  --rule:rgba(18,18,15,.14);
  --panel-bg:#12120F; --panel-fg:#EFECE4; --panel-rule:rgba(239,236,228,.16); --panel-muted:#8D8A80;
  --accent:#FF6A00; --tint:#FF6A00;
  --ease:cubic-bezier(.16,1,.3,1);
  --pad:clamp(20px,5vw,88px);
}
html.dark{
  --paper:#111110; --paper-2:#171714; --paper-3:#232320;
  --ink:#EDEAE2; --ink-2:#D6D2C8; --muted:#8E8A80;
  --rule:rgba(237,234,226,.15);
  --panel-bg:#080807; --panel-fg:#EDEAE2; --panel-rule:rgba(237,234,226,.14); --panel-muted:#87847B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{transition:background-color .5s ease,color .5s ease}
body{background:var(--paper);color:var(--ink);font-family:'Satoshi','Inter',system-ui,sans-serif;
  font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.lock{overflow:hidden;padding-right:var(--sbw,0px)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#12120F}
header{position:fixed;top:0;left:0;right:0;z-index:400;display:flex;align-items:center;
  justify-content:space-between;padding:22px var(--pad);mix-blend-mode:difference;color:#fff}
header .brand{font-family:'Humanism',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase}
header .brand i{color:var(--accent);font-style:normal}
.navr{display:flex;align-items:center;gap:22px}
.navlink{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;position:relative;padding:4px 0}
.navlink::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:#fff;transition:width .45s var(--ease)}
.navlink:hover::after,.navlink[aria-current]::after{width:100%}
.tglbtn{display:inline-flex;align-items:center;gap:11px;background:none;border:none;
  padding:12px 8px 12px 12px;margin:-12px -8px -12px -12px;position:relative;z-index:2;
  cursor:pointer;color:inherit;transition:opacity .3s}
.tglbtn:hover{opacity:.65}
.tgl-mini{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;opacity:.85}
.tgl{position:relative;display:block;width:48px;height:25px;border:1px solid currentColor;border-radius:20px;background:none;flex:none;overflow:hidden;transition:background .45s var(--ease)}
.tgl .knob{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:currentColor;
  transition:transform .55s cubic-bezier(.5,1.6,.4,1),width .3s var(--ease)}
.tglbtn:active .tgl .knob{width:24px}
html.dark .tgl .knob{transform:translateX(23px)}
html.dark .tglbtn:active .tgl .knob{transform:translateX(16px)}
@media (max-width:820px){.navr{gap:14px}.navlink{font-size:10px;letter-spacing:.14em}.tgl-mini{display:none}}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:12px;top:-60px;z-index:9999;background:var(--accent);color:#12120F;
  padding:12px 20px;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;transition:top .2s ease}
.skip:focus{top:12px}
/* the standalone page renders the same markup, just not inside the overlay */
#page{position:relative}
</style>
</head>
<body>
<a class="skip" href="#page">Skip to the content</a>

<header>
  <a class="brand" href="index.html">vithun<i>.</i></a>
  <nav class="navr">
    <a class="navlink" href="index.html">Home</a>
    <a class="navlink" href="about.html">About</a>
    <a class="navlink" href="work.html" aria-current="page">Work</a>
    <a class="navlink" href="index.html#contact">Contact</a>
    <button class="tglbtn" id="themeBtn" data-theme onclick="toggleTheme()" aria-label="Theme">
      <span class="tgl-mini" id="themeMini">Light</span>
      <span class="tgl"><span class="knob"></span></span>
    </button>
  </nav>
</header>

<main id="page" class="pv"></main>

<script src="cases.js"></script>
<script src="globe-mask.js"></script>
<script src="globe.js"></script>
<script src="pages.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
$('#page').innerHTML=window.WORK_HTML();
if(window.pvSplitAll)window.pvSplitAll($('#page'));
if(window.softScroll)window.softScroll(document);

/* reveals, re-armed on the way back up */
if(typeof IntersectionObserver==='undefined'){$$('.rv').forEach(e=>e.classList.add('in'));}
else{
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('in');return;}
    if(e.boundingClientRect.top>0)e.target.classList.remove('in');
  }),{threshold:.1,rootMargin:'0px 0px -5% 0px'});
  $$('.rv').forEach(e=>io.observe(e));
}

/* the theme control is the shared one in theme.js */
;

/* on this standalone page the other one is a real link, and a project opens
   the case study overlay */
$('#page').addEventListener('click',e=>{
  const go=e.target.closest('[data-pvgo]');
  if(go){const n=go.getAttribute('data-pvgo');
    if(window.openPage)window.openPage(n);else location.href=n+'.html';return;}
  const cs=e.target.closest('[data-case-i]');
  if(cs){
    const i=+cs.getAttribute('data-case-i');
    if(window.openCase)window.openCase(i);else location.href='case.html?p='+i;
  }
});
</script>
<script src="pageview.js"></script>
<script src="caseview.js"></script>
<script src="chat.js" defer></script>
</body>
</html>
